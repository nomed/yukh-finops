name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JSON schema and fixture parse
        run: |
          python -m json.tool contracts/usage-event.schema.json >/dev/null
          python -m json.tool fixtures/usage-event.synthetic.json >/dev/null
